# =============================================================================
# GlobeLens AI — Alembic Configuration
# =============================================================================
# NOTE: The [alembic] sqlalchemy.url value below is intentionally set to an
# environment variable placeholder. The actual connection string is injected
# dynamically inside env.py from settings.SYNC_DATABASE_URL, so this value
# is never actually read at runtime. It is kept here for Alembic's config
# parser but overridden in env.py via config.set_main_option().
# =============================================================================

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Filename template for new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# Prepend sys.path with the backend/app directory so our imports work
# This is set dynamically in env.py via sys.path.insert()
prepend_sys_path = .

# Override DB URL at runtime via env.py — do NOT hardcode secrets here
sqlalchemy.url = postgresql+psycopg2://placeholder:placeholder@db/placeholder


# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
