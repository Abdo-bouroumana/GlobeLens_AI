<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GlobeLens AI - 404</title>

                    "colors": {
                        "on-secondary-fixed": "#111c2d",

                        "on-tertiary-fixed": "#271901",
                        "surface-container-high": "#1c2b3c",
                        "surface-container-low": "#0d1c2d",
                        "on-tertiary-container": "#957d5a",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-error": "#690005",
                        "tertiary": "#dec29a",
                        "inverse-primary": "#565e74",
                        "secondary-fixed-dim": "#bcc7de",
                        "tertiary-container": "#231500",
                        "primary-fixed": "#dae2fd",
                        "surface-dim": "#051424",
                        "on-surface": "#d4e4fa",
                        "primary": "#bec6e0",
                        "on-primary-fixed": "#131b2e",
                        "on-primary": "#283044",
                        "primary-container": "#0f172a",
                        "on-primary-container": "#798098",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#273647",
                        "surface-tint": "#bec6e0",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container-highest": "#273647",
                        "on-background": "#d4e4fa",
                        "secondary": "#bcc7de",
                        "outline-variant": "#45464d",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed-variant": "#574425",
                        "on-secondary-fixed-variant": "#3c475a",
                        "tertiary-fixed": "#fcdeb5",
                        "on-tertiary": "#3e2d11",
                        "secondary-fixed": "#d8e3fb",
                        "error-container": "#93000a",
                        "surface-bright": "#2c3a4c",
                        "surface-container-lowest": "#010f1f",
                        "on-secondary": "#263143",
                        "inverse-on-surface": "#233143",
                        "outline": "#909097",

                    },
                    "borderRadius": {

                    "spacing": {

<style>
        body {
            background-color: #051424; /* surface */
        }
        .glass-panel {
            background: rgba(18, 33, 49, 0.7); /* surface-container with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #334155; /* Slate border for dossier feel */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(190, 198, 224, 0.05) 0%, rgba(5, 20, 36, 0) 70%); /* primary color glow */
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .data-grid-bg {
            position: absolute;
            inset: 0;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(69, 70, 77, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(69, 70, 77, 0.1) 1px, transparent 1px); /* outline-variant faint */
            z-index: 0;
            pointer-events: none;
        }

        /* Glitch effect for the 404 text */
        .glitch-wrapper {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 rgba(255, 180, 171, 0.7); /* error color */
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 rgba(190, 198, 224, 0.7); /* primary color */
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 44px, 0); }
            20% { clip: rect(62px, 9999px, 98px, 0); }
            40% { clip: rect(12px, 9999px, 59px, 0); }
            60% { clip: rect(89px, 9999px, 14px, 0); }
            80% { clip: rect(22px, 9999px, 102px, 0); }
            100% { clip: rect(74px, 9999px, 33px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(15px, 9999px, 88px, 0); }
            40% { clip: rect(93px, 9999px, 20px, 0); }
            60% { clip: rect(34px, 9999px, 75px, 0); }
            80% { clip: rect(81px, 9999px, 42px, 0); }
            100% { clip: rect(11px, 9999px, 99px, 0); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased overflow-hidden min-h-screen flex flex-col selection:bg-primary-container selection:text-primary">
<!-- Background Elements -->
<div class="data-grid-bg"></div>
<div class="ambient-glow"></div>
<main class="flex-grow flex items-center justify-center p-margin-mobile relative z-10 w-full max-w-container-max-width mx-auto">
<!-- Dossier Card / Glass Panel -->
<div class="glass-panel rounded-xl p-stack-lg max-w-2xl w-full flex flex-col md:flex-row gap-stack-lg items-center md:items-start relative overflow-hidden group hover:border-primary transition-colors duration-500">
<!-- Redaction Bar Accent Top -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-variant flex">
<div class="h-full bg-error w-1/4"></div>
<div class="h-full bg-outline-variant w-1/2 ml-auto opacity-50"></div>
</div>
<!-- Iconography Area -->
<div class="flex-shrink-0 bg-surface-container-lowest p-stack-md rounded-lg border border-outline-variant shadow-[0_2px_0px_rgba(0,0,0,0.4)] flex items-center justify-center">
<span class="material-symbols-outlined text-display-lg text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">
                    policy
                </span>
</div>
<!-- Content Area -->
<div class="flex-col w-full text-center md:text-left">
<div class="glitch-wrapper mb-stack-sm">
<h1 class="font-display-lg text-display-lg text-on-surface glitch-text" data-text="Intelligence Gap (404)">
                        Intelligence Gap (404)
                    </h1>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg max-w-lg leading-relaxed">
                    The intelligence dossier you are looking for has either been redacted, moved, or never existed.
                </p>
<!-- Search Form -->
<form action="#" class="w-full relative mb-stack-md group" method="GET">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">
                            search
                        </span>
</div>
<input aria-label="Search intelligence feed" class="w-full bg-surface border border-outline text-on-surface font-body-md rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-all shadow-inner" placeholder="Search global intelligence feed..." type="text"/>
<!-- decorative scanline in input on focus -->
<div class="absolute bottom-0 left-0 h-[1px] bg-primary w-0 group-focus-within:w-full transition-all duration-300"></div>
</form>
<!-- Action Button -->
<div class="flex justify-center md:justify-start">
<a class="inline-flex items-center gap-2 bg-primary text-on-primary font-label-caps uppercase px-6 py-3 rounded border border-transparent hover:bg-primary-fixed-dim hover:shadow-[0_2px_0px_rgba(0,0,0,0.4)] transition-all active:scale-95 tracking-wide" href="/">
<span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1;">
                            home
                        </span>
                        Return to Home Feed
                    </a>
</div>
<!-- Terminal-esque metadata (Atmospheric) -->
<div class="mt-stack-lg border-t border-outline-variant/30 pt-stack-sm flex justify-between items-center opacity-60">
<span class="font-mono-data text-mono-data text-on-surface-variant">ERR_CODE: 404_REDACTED</span>
<span class="font-mono-data text-mono-data text-on-surface-variant tracking-widest">TS: <span id="timestamp"></span></span>
</div>
</div>
</div>
</main>
<script>
        // Set dynamic timestamp for atmospheric effect
        document.addEventListener('DOMContentLoaded', () => {
            const tsElement = document.getElementById('timestamp');
            if(tsElement) {
                const now = new Date();
                // Format: YYYY-MM-DD.HHMM.SSZ
                const formatted = `${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${String(now.getUTCDate()).padStart(2,'0')}.${String(now.getUTCHours()).padStart(2,'0')}${String(now.getUTCMinutes()).padStart(2,'0')}.${String(now.getUTCSeconds()).padStart(2,'0')}Z`;
                tsElement.textContent = formatted;
            }
        });
    </script>
</body></html>
